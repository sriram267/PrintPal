<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palora — Workshop OS & Ambient Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --ambient-glow: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.05) 45%, transparent 70%);
        --dock-bg: rgba(255, 255, 255, 0.88);
        --dock-border: rgba(226, 232, 240, 0.95);
        --dock-shadow: 0 20px 48px -8px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
        --dock-btn-bg: rgba(248, 250, 252, 0.92);
        --dock-btn-border: rgba(226, 232, 240, 0.95);
        --dock-btn-color: #334155;
        --dock-btn-hover-bg: #ffffff;
        --dock-btn-hover-border: #cbd5e1;
        --dock-btn-hover-color: #0f172a;
        --dock-btn-primary-bg: #4f46e5;
        --dock-btn-primary-border: #4338ca;
        --dock-btn-primary-color: #ffffff;
        --dock-btn-primary-hover-bg: #4338ca;
        --dock-separator: rgba(226, 232, 240, 0.95);
      }

      [data-theme="dark"] {
        --ambient-glow: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(168, 85, 247, 0.08) 45%, transparent 70%);
        --dock-bg: rgba(14, 16, 21, 0.82);
        --dock-border: rgba(255, 255, 255, 0.12);
        --dock-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 0, 0, 0.5);
        --dock-btn-bg: rgba(255, 255, 255, 0.05);
        --dock-btn-border: rgba(255, 255, 255, 0.08);
        --dock-btn-color: #f1f2f4;
        --dock-btn-hover-bg: rgba(255, 255, 255, 0.12);
        --dock-btn-hover-border: rgba(255, 255, 255, 0.2);
        --dock-btn-hover-color: #ffffff;
        --dock-btn-primary-bg: rgba(99, 102, 241, 0.25);
        --dock-btn-primary-border: rgba(99, 102, 241, 0.5);
        --dock-btn-primary-color: #ffffff;
        --dock-btn-primary-hover-bg: rgba(99, 102, 241, 0.4);
        --dock-separator: rgba(255, 255, 255, 0.1);
      }

      .ambient-glow {
        position: fixed;
        top: -120px;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 260px;
        background: var(--ambient-glow);
        filter: blur(50px);
        pointer-events: none;
        z-index: 0;
        transition: background 0.3s ease;
      }

      .notch-guide {
        position: fixed;
        top: 2px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: var(--wake-strip-guide, rgba(0, 0, 0, 0.35));
        letter-spacing: 0.05em;
        pointer-events: none;
        z-index: 10001;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Interactive Simulator Dock */
      .dock-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10002;
        background: var(--dock-bg);
        border: 1px solid var(--dock-border);
        box-shadow: var(--dock-shadow);
        border-radius: 20px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        backdrop-filter: blur(24px) saturate(180%);
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .dock-btn {
        background: var(--dock-btn-bg);
        border: 1px solid var(--dock-btn-border);
        border-radius: 12px;
        color: var(--dock-btn-color);
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 500;
        padding: 7px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
      }

      .dock-btn:hover {
        background: var(--dock-btn-hover-bg);
        border-color: var(--dock-btn-hover-border);
        color: var(--dock-btn-hover-color);
        transform: translateY(-1px);
      }

      .dock-btn:active {
        transform: translateY(0);
      }

      .dock-btn.primary {
        background: var(--dock-btn-primary-bg);
        border-color: var(--dock-btn-primary-border);
        color: var(--dock-btn-primary-color);
      }

      .dock-btn.primary:hover {
        background: var(--dock-btn-primary-hover-bg);
      }

      .dock-separator {
        width: 1px;
        height: 20px;
        background: var(--dock-separator);
        margin: 0 2px;
        transition: background 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- Ambient Top Glow -->
    <div class="ambient-glow"></div>

    <!-- Floating Interactive Simulator Controls -->
    <div class="dock-container">
      <button class="dock-btn primary" onclick="window.Coucou?.toggle()" title="Toggle between compact notch and expanded card">
        ⚡ Toggle Island
      </button>
      <button class="dock-btn" onclick="window.Coucou?.launchGreeting()" title="Replay Mochi's launch wave and theme">
        👋 Greet
      </button>
      <div class="dock-separator"></div>
      <button class="dock-btn" onclick="window.Coucou?.simulateApproval()" title="Trigger a permission approval in the notch">
        🛡️ Approval
      </button>
      <button class="dock-btn" onclick="window.Coucou?.simulateQuestion()" title="Trigger an interactive question in the notch">
        ❓ Question
      </button>
      <button class="dock-btn" onclick="window.Coucou?.simulateTask('working')" title="Simulate an active agent task">
        ⚙️ Working
      </button>
      <button class="dock-btn" onclick="window.Coucou?.simulateTask('finished')" title="Simulate a finished celebration">
        🎉 Done
      </button>
      <div class="dock-separator"></div>
      <button class="dock-btn" onclick="window.Coucou?.toggleWardrobe()" title="Open Mochi's wardrobe">
        👔 Wardrobe
      </button>
      <button class="dock-btn" onclick="window.Coucou?.expand('settings')" title="Open settings">
        ⚙️ Settings
      </button>
      <div class="dock-separator"></div>
      <button id="theme-btn" class="dock-btn" onclick="window.toggleTheme()" title="Toggle White / Dark Theme">
        <span id="theme-btn-icon">🌙</span> <span id="theme-btn-text">Dark Mode</span>
      </button>
    </div>

    <!-- Coucou Dynamic Island Mount Point -->
    <div id="root"></div>

    <script>
      (function() {
        const saved = localStorage.getItem('palgen_theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);

        function updateBtn() {
          const current = document.documentElement.getAttribute('data-theme') || 'light';
          const icon = document.getElementById('theme-btn-icon');
          const text = document.getElementById('theme-btn-text');
          if (icon && text) {
            if (current === 'light') {
              icon.textContent = '🌙';
              text.textContent = 'Dark Mode';
            } else {
              icon.textContent = '☀️';
              text.textContent = 'White Theme';
            }
          }
        }

        window.toggleTheme = function() {
          const current = document.documentElement.getAttribute('data-theme') || 'light';
          const next = current === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('palgen_theme', next);
          updateBtn();
        };

        window.addEventListener('DOMContentLoaded', updateBtn);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
