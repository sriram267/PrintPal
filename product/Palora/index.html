<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintPal — Workshop ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <style>
      :root {
        --ambient-glow: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(168, 85, 247, 0.03) 45%, transparent 70%);
      }

      .ambient-glow {
        display: none !important;
      }

      #printpal-dock {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Ambient Top Glow -->
    <div class="ambient-glow"></div>

    <!-- PrintPal Leads Front-Office Module -->
    <div id="printpal-leads-root"></div>

    <!-- Coucou Dynamic Island Mount Point -->
    <div id="root" style="display: none;"></div>

    <!-- PrintPal Workshop Companion Interactive Dock (Hidden in ERP Mode) -->
    <nav id="printpal-dock" aria-label="Workshop Simulator Dock" style="display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(14, 15, 18, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.05);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #f5f6f8;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    ">
      <div style="display: flex; align-items: center; gap: 6px; padding-right: 8px; border-right: 1px solid rgba(255, 255, 255, 0.1);">
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e;"></span>
        <strong style="font-weight: 600; letter-spacing: -0.01em; color: #fff;">PrintPal Island</strong>
      </div>

      <button id="btn-open-workshop" onclick="window.Coucou?.openWorkshop()" style="
        background: rgba(34, 211, 238, 0.15); border: 1px solid rgba(34, 211, 238, 0.35);
        border-radius: 9999px; padding: 6px 12px; color: #22d3ee; font-size: 11px; font-weight: 600;
        cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
      " onmouseover="this.style.background='rgba(34,211,238,0.25)'" onmouseout="this.style.background='rgba(34,211,238,0.15)'">
        <span>🛠️</span> Workshop Truth Hub
      </button>

      <button id="btn-elec-derate" onclick="window.Coucou?.simulateElectricalCheck()" style="
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px; padding: 6px 12px; color: #f5f6f8; font-size: 11px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
      " onmouseover="this.style.background='rgba(245,165,36,0.2)';this.style.borderColor='rgba(245,165,36,0.4)'" onmouseout="this.style.background='rgba(255,255,255,0.06)';this.style.borderColor='rgba(255,255,255,0.08)'">
        <span>⚡</span> SMPS 1.25x Derating
      </button>

      <button id="btn-sheet-seam" onclick="window.Coucou?.simulateSheetSeamCheck()" style="
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px; padding: 6px 12px; color: #f5f6f8; font-size: 11px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
      " onmouseover="this.style.background='rgba(99,102,241,0.2)';this.style.borderColor='rgba(99,102,241,0.4)'" onmouseout="this.style.background='rgba(255,255,255,0.06)';this.style.borderColor='rgba(255,255,255,0.08)'">
        <span>📐</span> 8x4ft ACP Seam Split
      </button>

      <button id="btn-dispatch-gate" onclick="window.Coucou?.simulateDispatchGateCheck()" style="
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px; padding: 6px 12px; color: #f5f6f8; font-size: 11px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
      " onmouseover="this.style.background='rgba(244,80,94,0.2)';this.style.borderColor='rgba(244,80,94,0.4)'" onmouseout="this.style.background='rgba(255,255,255,0.06)';this.style.borderColor='rgba(255,255,255,0.08)'">
        <span>🔒</span> 50/40/10 Dispatch Gate
      </button>

      <button id="btn-workshop-job" onclick="window.Coucou?.simulateWorkshopJob()" style="
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px; padding: 6px 12px; color: #f5f6f8; font-size: 11px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
      " onmouseover="this.style.background='rgba(34,197,94,0.2)';this.style.borderColor='rgba(34,197,94,0.4)'" onmouseout="this.style.background='rgba(255,255,255,0.06)';this.style.borderColor='rgba(255,255,255,0.08)'">
        <span>🖨️</span> Ruida CNC Cut
      </button>

      <button id="btn-safety-alert" onclick="window.Coucou?.simulateSafetyAlert()" style="
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px; padding: 6px 12px; color: #f5f6f8; font-size: 11px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
      " onmouseover="this.style.background='rgba(232,121,249,0.2)';this.style.borderColor='rgba(232,121,249,0.4)'" onmouseout="this.style.background='rgba(255,255,255,0.06)';this.style.borderColor='rgba(255,255,255,0.08)'">
        <span>⚠️</span> Pelmet/Thermal Alert
      </button>

      <button id="btn-job-finish" onclick="window.Coucou?.simulateFinish()" style="
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px; padding: 6px 12px; color: #f5f6f8; font-size: 11px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
      " onmouseover="this.style.background='rgba(34,211,238,0.2)';this.style.borderColor='rgba(34,211,238,0.4)'" onmouseout="this.style.background='rgba(255,255,255,0.06)';this.style.borderColor='rgba(255,255,255,0.08)'">
        <span>🎉</span> Zero-Scrap Finish
      </button>

    </nav>

    <script>
      (function() {
        // Strictly light theme per workshop requirement
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('printpal_theme', 'light');
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
